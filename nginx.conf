# Example Nginx reverse-proxy configuration for the calculator backend.
#
# Deploy the backend with Gunicorn on 127.0.0.1:5000, then let Nginx
# expose it on port 80. Front-end static files can be served from the
# "frontend" root below; the "/api/" location proxies requests to Flask.
#
# Replace "your-domain-or-ip" with your server address.

server {
    listen 80;
    server_name your-domain-or-ip;

    # Serve the built front-end (npm run build -> dist/).
    root /var/www/calculator/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Flask/Gunicorn backend.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
